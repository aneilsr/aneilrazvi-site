<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Your Design Maturity Read</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--teal:#00BCD4;--teal-dark:#0097A7;--teal-wash:#E4F8FB;--navy:#1E3A5F;--dark:#0F1923;
 --gray:#F4F6F8;--text:#1A1A2E;--muted:#6B7280;--line:#E2E8EC;--orange:#F97316;--orange-wash:#FFF1E6;--white:#fff;
 --radius:16px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{background:var(--gray);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;
 font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:56rem;margin:0 auto;padding:2.4rem 1.15rem 5rem}
.sheet{background:var(--white);border-radius:var(--radius);padding:2.2rem 2.2rem 2.4rem;
 box-shadow:0 4px 24px rgba(0,0,0,.07);margin-bottom:1.2rem}
.eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-dark);font-weight:700}
h1{font-family:'DM Serif Display',Georgia,serif;font-size:2.4rem;line-height:1.08;color:var(--dark);margin-top:.5rem}
.for{font-size:.9rem;color:var(--muted);margin-top:.7rem}
.for b{color:var(--text);font-weight:600}
.rule{height:3px;background:var(--teal);width:56px;margin:1.1rem 0 1.3rem}
.bands{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.band{border-radius:12px;padding:1.1rem 1.2rem;min-width:0}
.band.cap{background:var(--teal-wash);border-left:4px solid var(--teal-dark)}
.band.ai{background:var(--orange-wash);border-left:4px solid var(--orange)}
.band .k{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.band.cap .k{color:var(--teal-dark)} .band.ai .k{color:#C2410C}
.band h2{font-family:'DM Serif Display',Georgia,serif;font-size:1.7rem;color:var(--dark);margin:.3rem 0 .1rem;line-height:1.1}
.band .lv{font-size:.78rem;color:var(--muted);margin-bottom:.45rem}
.band p{font-size:.85rem;color:#4B5563;line-height:1.5}
h3{font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700;
 margin:1.8rem 0 .8rem;padding-bottom:.4rem;border-bottom:1px solid var(--line)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
.charts>*{min-width:0}
svg{width:100%;height:auto;display:block}
.cap2{font-size:.8rem;color:var(--muted);margin-top:.5rem;line-height:1.45}
.dims{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
.dims>*{min-width:0}
.bar{display:flex;align-items:center;gap:.55rem;margin-bottom:.35rem}
.bl{flex:0 0 8.2em;font-size:.82rem;color:#4B5563}
.bt{flex:1;height:6px;background:#EDF1F3;border-radius:3px;overflow:hidden;min-width:0}
.bf{display:block;height:100%;border-radius:3px}
.bv{flex:0 0 2.2em;text-align:right;font-size:.82rem;font-weight:700;color:var(--dark)}
.of{color:var(--muted);font-weight:400}
.gap{background:var(--gray);border-radius:12px;padding:1rem 1.15rem;margin-top:1.3rem;font-size:.9rem;color:#374151}
.gap b{color:var(--dark)}
.rec{background:var(--dark);border-radius:14px;padding:1.5rem 1.6rem;color:var(--white)}
.rec .k{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:700}
.rec h2{font-family:'DM Serif Display',Georgia,serif;font-size:1.95rem;margin:.4rem 0 .5rem}
.rec p{font-size:.92rem;color:#C3CED5;line-height:1.55}
.rec .pr{margin-top:1rem;padding-top:1rem;border-top:1px solid #2A3A44;display:flex;
 justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap}
.rec .amt{font-family:'DM Serif Display',Georgia,serif;font-size:1.8rem}
.rec .dur{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:#8A97A0;font-weight:600}
.ts{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem}
.ts>*{min-width:0}
h4{font-size:.95rem;color:var(--dark);font-weight:700;margin-bottom:.45rem}
ul{list-style:none} li{font-size:.87rem;color:#4B5563;padding-left:.85rem;position:relative;margin-bottom:.35rem;line-height:1.5}
li:before{content:"";position:absolute;left:0;top:.55em;width:5px;height:5px;border-radius:50%;background:var(--teal)}
ul.nope li:before{background:var(--muted)} ul.nope li{color:var(--muted)}
.wk li{padding-left:0} .wk li:before{display:none}
ol{padding-left:1.2rem} ol li{padding-left:.2rem;margin-bottom:.4rem} ol li:before{display:none}
table.rank{width:100%;border-collapse:collapse;font-size:.87rem}
table.rank th{text-align:left;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
 font-weight:700;padding:0 .6rem .4rem 0;border-bottom:1px solid var(--line)}
table.rank td{padding:.5rem .6rem .5rem 0;border-bottom:1px solid #F2F5F6;color:#4B5563}
table.rank td.n{font-weight:600;color:var(--dark)} table.rank td.f{text-align:right;font-weight:700;color:var(--teal-dark)}
.actions{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.4rem}
.b{display:inline-block;background:var(--teal);color:var(--dark);font-weight:700;font-size:.95rem;
 padding:.8rem 1.5rem;border-radius:99px;text-decoration:none;border:none;cursor:pointer;font-family:inherit}
.b.ghost{background:transparent;color:var(--teal-dark);border:1.5px solid var(--line-firm,#CBD5DB)}
.sig{margin-top:1.6rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.sig b{color:var(--dark)}
.state{padding:3.5rem 1rem;text-align:center;color:var(--muted)}
.state h2{font-family:'DM Serif Display',Georgia,serif;font-size:1.6rem;color:var(--dark);margin-bottom:.5rem}
@media (max-width:720px){
  .bands,.charts,.dims,.ts{grid-template-columns:1fr}
  h1{font-size:1.85rem} .sheet{padding:1.4rem 1.2rem 1.6rem}
}
.zoom{position:absolute;right:.55rem;top:.55rem;z-index:2;display:flex;align-items:center;justify-content:center;
 width:30px;height:30px;border-radius:50%;background:var(--white);border:1px solid var(--line);
 box-shadow:0 1px 4px rgba(15,25,35,.14);color:var(--muted);cursor:zoom-in}
.zwrap{position:relative}
.zwrap:hover .zoom{color:var(--teal-dark);border-color:var(--teal)}
.lb{position:fixed;inset:0;z-index:60;background:rgba(15,25,35,.72);display:flex;align-items:center;
 justify-content:center;padding:1.2rem;opacity:0;transition:opacity .18s ease}
.lb.on{opacity:1}
/* A class rule beats the browser's [hidden] rule, so without this the overlay
   stays display:flex over the whole page and swallows every click. */
.lb[hidden]{display:none!important}
.lbin{background:var(--white);border-radius:var(--radius);padding:1.5rem;width:min(94vw,940px);
 max-height:92vh;overflow:auto;position:relative}
.lbh{display:flex;justify-content:space-between;align-items:center;margin-bottom:.9rem}
.lbh h4{font-family:'DM Serif Display',Georgia,serif;font-size:1.25rem;color:var(--dark);font-weight:400}
.lbx{background:none;border:none;font-size:1.4rem;line-height:1;color:var(--muted);cursor:pointer;padding:.2rem .4rem}
@media print{.lb{display:none!important}.zoom{display:none!important}}
@page{size:Letter;margin:0}
@media print{
  html{font-size:12.5px}
  html,body{background:#fff}
  .wrap{max-width:none;padding:0;margin:0}
  .sheet{box-shadow:none;border-radius:0;margin:0;padding:.5in .55in}
  .sheet:first-of-type{break-after:page;page-break-after:always}
  .actions,.noprint{display:none!important}
  .charts,.dims,.ts,.bands{grid-template-columns:1fr 1fr!important}
  .bands,.charts,.dims,.gap,.rec,.ts,table.rank,ol,.sig{break-inside:avoid;page-break-inside:avoid}
  h3{break-after:avoid;page-break-after:avoid}
  a[href]:after{content:""}
}
</style></head><body>
<div class="wrap" id="root"><div class="state"><h2>Loading your read</h2><p>One moment.</p></div></div>
<script>
var CAPDIM = ["Research","Design's seat","Measurement","System","Process","Executives"];

var AIDIM = ["Practical use","Strategy","Org change","Product AI","Ownership","Eng alignment"];

var CAPL = [
 {n:"Absent",d:"Design happens, but nobody owns it as a practice. Decisions get made on instinct and cleaned up later.",lo:0,hi:4},
 {n:"Limited",d:"Design exists as a service. It is called in to make things presentable once the thinking is finished.",lo:5,hi:9},
 {n:"Emergent",d:"Design is real but inconsistent. It works when a specific person pushes, and reverts when they get busy. Roughly half of all organizations sit here.",lo:10,hi:16},
 {n:"Structured",d:"Design is established, with process and standards that hold. The remaining gains come from measurement and from earning decisions earlier.",lo:17,hi:22},
 {n:"Integrated",d:"Design is a peer function with a seat in planning and its own measures. About 4 percent of organizations reach this.",lo:23,hi:27},
 {n:"User-Driven",d:"Evidence about users drives decisions across the company, not only inside design. Fewer than 1 in 2,000 report this.",lo:28,hi:30}
];

var AIL = [
 {n:"Limited",d:"AI is a personal productivity aid for admin work. No strategy, no budget, no training.",lo:0,hi:4},
 {n:"Reactive",d:"Ad hoc experimentation driven by pressure to ship something with AI in it. A lot of throwaway work.",lo:5,hi:9},
 {n:"Developing",d:"AI is a genuine prototyping accelerator. Adoption is problem-led and workflows are getting written down.",lo:10,hi:16},
 {n:"Embedded",d:"AI is core infrastructure. Design scope has grown to cover trust, uncertainty, and what the system does when it should refuse.",lo:17,hi:22},
 {n:"Leading",d:"Designers think natively in code and systems, and shift from producing artifacts to setting direction.",lo:23,hi:27},
 {n:"Symbiotic",d:"Design time and runtime blur. Designers set constraints and the system assembles interfaces by context.",lo:28,hi:30}
];

var SCOPE = {
 "The Audit": {
   weeks:["<b>Week 1.</b> Interviews with six to eight people across design, product and engineering. Artefact review: your last three shipped features, end to end.",
          "<b>Week 2.</b> Scoring against the twelve dimensions, written findings, and a prioritised sequence with owners and effort."],
   get:["A written read on where the practice actually sits, with evidence, not impressions",
        "The three constraints costing you the most, ranked",
        "A ninety-day sequence someone on your team can run without me"],
   nope:["No design work. This is diagnosis, not delivery.",
         "No hiring plan. That is a different conversation and usually premature.",
         "No tooling recommendations. Tools are almost never the constraint."]
 },
 "AI Experience Framework": {
   weeks:["<b>Week 1.</b> Where AI already touches your product and your team, and what it is actually doing versus what people believe it does.",
          "<b>Week 2.</b> The decision architecture: what the system may do alone, what it proposes, what it must never do without a human.",
          "<b>Week 3.</b> Patterns for provenance, uncertainty, refusal and reversibility, applied to two real flows in your product."],
   get:["A written framework your team applies without me in the room",
        "Two flows designed end to end as worked examples",
        "The refusal and escalation rules, which is the part almost everyone skips"],
   nope:["No model selection or evaluation. That is your engineering team.",
         "No prompt libraries. They rot in weeks.",
         "No claim that AI belongs in a given feature until the flow says it does."]
 },
 "Design System Build": {
   weeks:["<b>Week 1.</b> Audit of every component in production and the drift between them.",
          "<b>Week 2 to 3.</b> Tokens, core components, and the rules that govern how they compose.",
          "<b>Week 4.</b> Documentation written for the people who have to use it, not for designers.",
          "<b>Week 5.</b> Governance: contribution, review, adoption tracking, and a named owner."],
   get:["A working system in your codebase, not a Figma file",
        "Tokens and components covering your real surfaces",
        "The governance model, which is what makes it survive month three"],
   nope:["No full product redesign. The system serves the product you have.",
         "No migration of every legacy screen. I set the pattern and the path.",
         "No ongoing maintenance. That is the retainer."]
 },
 "Fractional Retainer": {
   weeks:["<b>Two days a week</b>, held on the same days so your team can plan around me.",
          "<b>First month.</b> Set the standard, name what good looks like, and get into the decisions that are already in flight.",
          "<b>Ongoing.</b> Direction, critique, hiring input, and hands on the work that matters most that month."],
   get:["A senior owner accountable for the bar, not an advisor with opinions",
        "Design present in planning and roadmap, not just execution",
        "Coaching that raises your team rather than replacing them"],
   nope:["Not full-time cover. Two days is two days, and I will tell you when the problem needs more.",
         "No exclusivity. I hold a small number of engagements at once.",
         "Not a stopgap while you recruit, unless we both name it as that up front."]
 }
};

function band(v,a){for(var j=0;j<a.length;j++){if(v>=a[j].lo&&v<=a[j].hi)return j;}return 0;}

function offers(cl,al){
  var sys=(ans[3]||0), meas=(ans[2]||0), seat=(ans[1]||0), use=(ans[6]||0), prod=(ans[9]||0);
  var L=[
   {n:"The Audit",p:"$7,500",d:"2 weeks",
    fit:cl<=2?95:(cl===3?55:35),
    why:cl<=2?"Your scores say the foundation has never been mapped. This is the cheapest way to find out whether the problem you think you have is the problem you actually have."
        :"Useful as an outside read on a functioning team, aimed at why the value is invisible rather than at fixing process you already have."},
   {n:"AI Experience Framework",p:"$15,000",d:"3 weeks",
    fit:(use>=2&&prod<=2)?98:(al<=1&&use>=2?90:(al>=2&&al<=3?75:40)),
    why:(use>=2&&prod<=2)?"Your team is using AI but it has not landed in the product. That gap is the single clearest signal in your answers."
        :(al<=1?"Adoption has started without a decision about what the system may do on its own. That decision is the work."
        :"You are past the basics. The next question is trust architecture: provenance, uncertainty, refusal, reversibility.")},
   {n:"Design System Build",p:"$22,000",d:"5 weeks",
    fit:sys<=2?96:(sys<=3?70:45),
    why:sys<=2?"Consistency scored lowest of your six capability dimensions, which means every new screen costs more than the last one."
        :"A system exists. The next move is components that assemble by context rather than a library people shop from."},
   {n:"Fractional Retainer",p:"$16,000/mo",d:"2 days a week",
    fit:(cl===2||cl===3)?92:(cl<=1?70:60),
    why:cl===2?"This band is where a part-time senior owner is the highest-leverage intervention that exists. The bar needs to hold on the days I am not there."
        :(cl<=1?"Someone has to own the standard before any project can stick. That is a person, not a deliverable."
        :"Augmentation rather than rescue. A named gap, held week over week by someone who still does the work.")}
  ];
  L.sort(function(a,b){return b.fit-a.fit;});
  return L;
}

function scatter(cx,ay){
  var W=520,H=340,L=108,T=16,cw=64,ch=46;
  var capN=["Absent","Limited","Emergent","Structured","Integrated","User-Driven"];
  var aiN=["Symbiotic","Leading","Embedded","Developing","Reactive","Limited"];
  var dist=[1,17,49,28,4,0.04];
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Your position on design capability and AI maturity">';
  for(var c=0;c<6;c++) s+='<rect x="'+(L+c*cw)+'" y="'+T+'" width="'+cw+'" height="'+(ch*6)+'" fill="#00BCD4" opacity="'+((dist[c]/49)*0.20).toFixed(3)+'"/>';
  for(var r=0;r<=6;r++) s+='<line x1="'+L+'" y1="'+(T+r*ch)+'" x2="'+(L+6*cw)+'" y2="'+(T+r*ch)+'" stroke="#E2E8EC"/>';
  for(var c2=0;c2<=6;c2++) s+='<line x1="'+(L+c2*cw)+'" y1="'+T+'" x2="'+(L+c2*cw)+'" y2="'+(T+6*ch)+'" stroke="#E2E8EC"/>';
  for(var r2=0;r2<6;r2++) s+='<text x="'+(L-9)+'" y="'+(T+r2*ch+ch/2+4)+'" text-anchor="end" font-family="Inter,sans-serif" font-size="10.5" fill="#6B7280">'+aiN[r2]+'</text>';
  for(var c3=0;c3<6;c3++){
    s+='<text x="'+(L+c3*cw+cw/2)+'" y="'+(T+6*ch+16)+'" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#6B7280">'+capN[c3]+'</text>';
    s+='<text x="'+(L+c3*cw+cw/2)+'" y="'+(T+6*ch+30)+'" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" font-weight="700" fill="#0097A7">'+dist[c3]+'%</text>';
  }
  var px=L+cx*cw+cw/2, py=T+(5-ay)*ch+ch/2;
  s+='<circle cx="'+px+'" cy="'+py+'" r="19" fill="#F97316" opacity="0.16"/>';
  s+='<circle cx="'+px+'" cy="'+py+'" r="19" fill="none" stroke="#F97316" stroke-width="2.5"/>';
  s+='<circle cx="'+px+'" cy="'+py+'" r="5.5" fill="#F97316"/>';
  s+='<text x="'+(L+3*cw)+'" y="'+(T+6*ch+47)+'" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" letter-spacing="1.5" fill="#6B7280">DESIGN CAPABILITY, WITH POPULATION SHARE</text>';
  s+='<text transform="translate(14,'+(T+3*ch)+') rotate(-90)" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" letter-spacing="1.5" fill="#6B7280">AI MATURITY</text>';
  return s+'</svg>';
}

function radar(){
  var W=452,H=352,cx=226,cy=168,R=112;
  var labels=CAPDIM.concat(AIDIM), n=12;
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Your score on each of the twelve dimensions">';
  function pt(k,frac){var a=(Math.PI*2*k/n)-Math.PI/2;return [cx+Math.cos(a)*R*frac, cy+Math.sin(a)*R*frac];}
  for(var ring=1;ring<=5;ring++){
    var d="";
    for(var k=0;k<n;k++){var p=pt(k,ring/5);d+=(k?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1);}
    s+='<path d="'+d+'Z" fill="none" stroke="#E2E8EC" stroke-width="1"/>';
  }
  for(var k2=0;k2<n;k2++){var e=pt(k2,1);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="#EDF1F3"/>';}
  var dCap="",dAi="";
  for(var k3=0;k3<n;k3++){
    var v=(ans[k3]||0)/5, p2=pt(k3,Math.max(v,0.02));
    var seg=(k3?"L":"M")+p2[0].toFixed(1)+","+p2[1].toFixed(1);
    dCap+=seg;
  }
  s+='<path d="'+dCap+'Z" fill="#00BCD4" fill-opacity="0.17" stroke="#0097A7" stroke-width="2"/>';
  for(var k4=0;k4<n;k4++){
    var v2=(ans[k4]||0)/5, p3=pt(k4,Math.max(v2,0.02));
    s+='<circle cx="'+p3[0].toFixed(1)+'" cy="'+p3[1].toFixed(1)+'" r="3.2" fill="'+(k4<6?"#0097A7":"#F97316")+'"/>';
    var lp=pt(k4,1.19), anch = (lp[0]>cx+6)?"start":((lp[0]<cx-6)?"end":"middle");
    s+='<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+3.5).toFixed(1)+'" text-anchor="'+anch+'" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="'+(k4<6?"#0097A7":"#F97316")+'">'+labels[k4]+'</text>';
  }
  s+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" letter-spacing="1.2" fill="#6B7280">TEAL = CAPABILITY   ORANGE = AI</text>';
  return s+'</svg>';
}
/* ---- runtime ---- */
var ans = [];
function esc(x){ return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function qp(n){ try { return new URLSearchParams(location.search).get(n) || null; } catch(e){ return null; } }

var SESSION = qp("s");
var BOOKING = "https://cal.com/aneil-razvi";

function track(ev){
  try {
    fetch("/api/report", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      keepalive: true,
      body: JSON.stringify({
        session_id: SESSION, event: ev,
        referrer: document.referrer || null,
        utm_source: qp("utm_source"), utm_medium: qp("utm_medium"), utm_campaign: qp("utm_campaign"),
        screen_w: window.innerWidth
      })
    }).catch(function(){});
  } catch(e){}
}


function zbtn(){ return '<div class="zoom" role="button" tabindex="0" aria-label="Enlarge chart">'+
  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">'+
  '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6M11 8.2v5.6M8.2 11h5.6"/></svg></div>'; }

function wireZoom(){
  var lb = document.createElement("div");
  lb.className = "lb"; lb.hidden = true;
  lb.innerHTML = '<div class="lbin"><div class="lbh"><h4></h4><button class="lbx" aria-label="Close">&times;</button></div><div class="lbc"></div></div>';
  document.body.appendChild(lb);
  var h4 = lb.querySelector("h4"), body = lb.querySelector(".lbc");
  function close(){ lb.classList.remove("on"); setTimeout(function(){ lb.hidden = true; }, 180); }
  lb.addEventListener("click", function(e){ if(e.target === lb) close(); });
  lb.querySelector(".lbx").addEventListener("click", close);
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !lb.hidden) close(); });
  Array.prototype.forEach.call(document.querySelectorAll(".zwrap"), function(w){
    function open(){
      var svg = w.querySelector(":scope > svg");   /* the chart, never the button icon */
      if(!svg) return;
      h4.textContent = w.getAttribute("data-zoom") || "";
      body.innerHTML = svg.outerHTML;
      lb.hidden = false;
      requestAnimationFrame(function(){ lb.classList.add("on"); });
    }
    w.addEventListener("click", open);
    w.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } });
  });
}

function bars(labels, offset, colour){
  return labels.map(function(l,i){
    var v = ans[i+offset] || 0;
    return '<div class="bar"><span class="bl">'+esc(l)+'</span>'+
      '<span class="bt"><span class="bf" style="width:'+((v/5)*100)+'%;background:'+colour+'"></span></span>'+
      '<span class="bv">'+v+'<span class="of">/5</span></span></div>';
  }).join("");
}

function fail(msg){
  document.getElementById("root").innerHTML =
    '<div class="state"><h2>'+esc(msg)+'</h2>'+
    '<p>If you took the assessment and this link is not working, reply to the email and I will send your read directly.</p>'+
    '<p style="margin-top:1.2rem"><a class="b" href="/maturity.html">Take the assessment</a></p></div>';
}

function draw(d){
  ans = Array.isArray(d.answers) ? d.answers : ((d.answers && (d.answers.raw || d.answers.values)) || []);
  var cs=0, as=0, j;
  for(j=0;j<6;j++)  cs += (ans[j]||0);
  for(j=6;j<12;j++) as += (ans[j]||0);
  var cl = band(cs, CAPL), al = band(as, AIL);
  var C = CAPL[cl], A = AIL[al];
  var OF = offers(cl, al), top = OF[0], sc = SCOPE[top.n] || SCOPE["The Audit"];
  var gap = cl - al;
  var gapLine = gap >= 2
    ? "Your design practice is meaningfully ahead of your AI adoption. That is the safer imbalance, but it leaves capability on the table."
    : gap <= -2
    ? "Your AI adoption is running ahead of your design practice. This is the more dangerous imbalance: AI accelerates whatever process you already have."
    : "Your two axes are roughly in step, which is less common than it sounds. The work now is moving both together.";
  var lowIdx=0, lowVal=99;
  for(j=0;j<12;j++){ if((ans[j]||0) < lowVal){ lowVal = ans[j]||0; lowIdx = j; } }
  var lowName = lowIdx < 6 ? CAPDIM[lowIdx] : AIDIM[lowIdx-6];

  var when = d.completed_at || d.created_at;
  var dateStr = when ? new Date(when).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}) : "";

  document.getElementById("root").innerHTML =
  '<div class="sheet">'+
    '<div class="eyebrow">Design Maturity Read</div>'+
    '<h1>'+esc(C.n)+' capability,<br>'+esc(A.n)+' on AI</h1>'+
    '<div class="for">Prepared for <b>'+esc(d.name||"you")+'</b>'+
      (d.company ? ' at <b>'+esc(d.company)+'</b>' : '')+
      (dateStr ? ' &nbsp;·&nbsp; '+esc(dateStr) : '')+
      ' &nbsp;·&nbsp; the scores are exactly what you saw on the page</div>'+
    '<div class="rule"></div>'+
    '<div class="bands">'+
      '<div class="band cap"><div class="k">Design capability</div><h2>'+esc(C.n)+'</h2>'+
        '<div class="lv">Level '+(cl+1)+' of 6 &nbsp;·&nbsp; '+cs+' of 30 points</div><p>'+esc(C.d)+'</p></div>'+
      '<div class="band ai"><div class="k">AI maturity</div><h2>'+esc(A.n)+'</h2>'+
        '<div class="lv">Level '+(al+1)+' of 6 &nbsp;·&nbsp; '+as+' of 30 points</div><p>'+esc(A.d)+'</p></div>'+
    '</div>'+
    '<h3>Where you sit, and the shape of it</h3>'+
    '<div class="charts">'+
      '<div><div class="zwrap" data-zoom="Where you sit">'+zbtn()+scatter(cl,al)+'</div><div class="cap2">Against the actual population. Shading is how many organizations sit in each column. The ring is you.</div></div>'+
      '<div><div class="zwrap" data-zoom="Your profile shape">'+zbtn()+radar()+'</div><div class="cap2">All twelve dimensions. The dents are where the work is. Lowest: <b>'+esc(lowName)+'</b>.</div></div>'+
    '</div>'+
    '<h3>Dimension by dimension</h3>'+
    '<div class="dims"><div>'+bars(CAPDIM,0,"#0097A7")+'</div><div>'+bars(AIDIM,6,"#F97316")+'</div></div>'+
    '<div class="gap"><b>The gap between your two axes.</b> '+esc(gapLine)+'</div>'+
  '</div>'+

  '<div class="sheet">'+
    '<div class="rec">'+
      '<div class="k">Best fit for where you are</div>'+
      '<h2>'+esc(top.n)+'</h2><p>'+esc(top.why)+'</p>'+
      '<div class="pr"><span class="amt">'+esc(top.p)+'</span><span class="dur">'+esc(top.d)+'</span></div>'+
    '</div>'+
    '<h3>What it involves</h3>'+
    '<div class="ts">'+
      '<div><h4>How it usually runs</h4><ul class="wk">'+sc.weeks.map(function(w){return '<li>'+w+'</li>';}).join('')+'</ul></div>'+
      '<div><h4>What you end up with</h4><ul>'+sc.get.map(function(g){return '<li>'+esc(g)+'</li>';}).join('')+'</ul>'+
        '<h4 style="margin-top:1rem">What this is not</h4><ul class="nope">'+sc.nope.map(function(n){return '<li>'+esc(n)+'</li>';}).join('')+'</ul></div>'+
    '</div>'+
    '<h3>How the four options ranked against your answers</h3>'+
    '<table class="rank"><tr><th>Engagement</th><th>Price</th><th>Term</th><th style="text-align:right">Fit</th></tr>'+
      OF.map(function(o){ return '<tr><td class="n">'+esc(o.n)+'</td><td>'+esc(o.p)+'</td><td>'+esc(o.d)+'</td><td class="f">'+o.fit+'</td></tr>'; }).join('')+
    '</table>'+
    '<p class="cap2">Ranked against your answers, not a generic order.</p>'+
    '<h3>The moves that matter next</h3>'+
    '<ol><li><b>'+esc(lowName)+'</b> is your lowest dimension of the twelve. Whatever else happens, that is where the first move goes.</li>'+
      '<li>'+(gap>=2?'Close the AI gap deliberately rather than by adoption drift. Your practice can absorb it faster than most.'
             :gap<=-2?'Slow the AI push until measurement and a system exist, or you will scale inconsistency.'
             :'Move both axes together. Picking one and leaving the other is how the gap opens.')+'</li>'+
      '<li>Decide who owns the standard when nobody is watching. That is a person, not a document.</li></ol>'+
    '<div class="actions noprint">'+
      '<a class="b" id="book" href="'+BOOKING+'" target="_blank" rel="noopener">Book thirty minutes</a>'+
      '<button class="b ghost" id="save">Save as PDF</button>'+
    '</div>'+
    '<div class="sig"><b>Aneil Razvi</b> &nbsp;·&nbsp; fractional design and AI experience leadership &nbsp;·&nbsp; '+
      '<a href="https://aneilrazvi.com" style="color:#0097A7;text-decoration:none">aneilrazvi.com</a> &nbsp;·&nbsp; hi@aneilrazvi.com</div>'+
  '</div>';

  var bk = document.getElementById("book");
  if (bk) bk.addEventListener("click", function(){ track("book_click"); });
  var sv = document.getElementById("save");
  if (sv) sv.addEventListener("click", function(){ window.print(); });
  wireZoom();
  var BASE_TITLE = document.title;
  window.addEventListener("beforeprint", function(){
    track("print");
    document.title = "Aneil Razvi - Design Maturity Read" + (d.company ? " - " + d.company : "");
  });
  window.addEventListener("afterprint", function(){ document.title = BASE_TITLE; });
}

(function(){
  if (!SESSION) { fail("This link is missing its reference."); return; }
  fetch("/api/report?s=" + encodeURIComponent(SESSION))
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      draw(d);
      track(sessionStorage.getItem("seen_" + SESSION) ? "revisit" : "view");
      try { sessionStorage.setItem("seen_" + SESSION, "1"); } catch(e){}
    })
    .catch(function(){ fail("We could not find that read."); });
})();
